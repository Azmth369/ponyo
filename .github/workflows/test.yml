name: Test
# Phase 4 adds report permission, retry, pause/enable, and PostgreSQL migration checks.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ponyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ponyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check dashboard and scheduler syntax
        run: npm --prefix dashboard run check && node --check src/api.js && node --check src/index.js && node --check src/reporting.js
      - name: Run test suite including dashboard authorization
        run: npm test
      - name: Validate dashboard migration on disposable PostgreSQL
        shell: bash
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d ponyo_test -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"
          docker exec -i "$container_id" psql -U postgres -d ponyo_test -v ON_ERROR_STOP=1 < supabase/migrations/20261018030000_event_report_publications.sql
          docker exec -i "$container_id" psql -U postgres -d ponyo_test -v ON_ERROR_STOP=1 < supabase/migrations/20261018_dashboard_control_panel.sql
          docker exec -i "$container_id" psql -U postgres -d ponyo_test -v ON_ERROR_STOP=1 < supabase/migrations/20261018120000_dashboard_report_management.sql
          docker exec -i "$container_id" psql -U postgres -d ponyo_test -v ON_ERROR_STOP=1 < supabase/tests/dashboard_control_panel_smoke.sql
