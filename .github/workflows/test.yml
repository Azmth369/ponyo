name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ponyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ponyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check dashboard and scheduler syntax
        run: npm --prefix dashboard run check && node --check src/api.js && node --check src/index.js
      - name: Run test suite including dashboard authorization
        run: npm test
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate dashboard migration on disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ponyo_test
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018_dashboard_control_panel.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/dashboard_control_panel_smoke.sql
