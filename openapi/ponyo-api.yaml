openapi: 3.0.3
info:
  title: Ponyo Clash of Clans API
  version: 1.0.3
  description: Access synced Clash of Clans data from Ponyo. Refresh only when explicitly requested.
servers:
  - url: https://ponyo-v845.onrender.com
security:
  - BearerAuth: []
paths:
  /api/v1/clan/player-capital-contribution:
    get:
      operationId: getPlayerCapitalContribution
      summary: Get a player's lifetime Clan Capital contribution
      description: Use this endpoint when asked for a player's total Capital contribution or contribution reputation. Prefer the player's exact player tag when available: tags are looked up directly against the live player profile and do not need to be in the current clan roster. Names are matched against current clan members and stored Capital Raid participants. This is the lifetime clanCapitalContributions statistic from the live profile, not total loot gained in a single Capital Raid Weekend.
      parameters:
        - in: query
          name: player
          required: true
          description: Exact player tag (recommended; works even if the player is no longer in the current clan) or player name. If multiple names match, the response lists candidates to disambiguate.
          schema:
            type: string
      responses:
        '200':
          description: Player lifetime contribution or ambiguous matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    properties:
                      name:
                        type: string
                      playerTag:
                        type: string
                      clanName:
                        type: string
                      townHallLevel:
                        type: integer
                      totalClanCapitalContribution:
                        type: integer
                    additionalProperties: true
                  metric:
                    type: string
                  source:
                    type: string
                  checkedAt:
                    type: string
                  note:
                    type: string
                  ambiguous:
                    type: boolean
                  message:
                    type: string
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        playerTag:
                          type: string
                        townHallLevel:
                          type: integer
                      additionalProperties: true
                additionalProperties: true
        '400':
          description: Missing player parameter
        '404':
          description: No current clan member matched
  /api/v1/clan/activity:
    get:
      operationId: getClanPlayerActivity
      summary: Get inferred last observed activity for clan members
      description: Returns each current clan member's latest stored activity timestamp inferred from snapshot changes. This is not an exact last-login time. It is estimated from changes in trophies, XP level, Town Hall level, troops donated, or troops received. Trophy changes alone can result from defensive battles. If no activity timestamp exists, more successful snapshots are needed.
      responses:
        '200':
          description: Clan member activity report
          content:
            application/json:
              schema:
                type: object
                properties:
                  clanName:
                    type: string
                  clanTag:
                    type: string
                  count:
                    type: integer
                  generatedAt:
                    type: string
                  note:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        playerTag:
                          type: string
                        name:
                          type: string
                        role:
                          type: string
                        townHallLevel:
                          type: integer
                        xpLevel:
                          type: integer
                        trophies:
                          type: integer
                        troopsDonated:
                          type: integer
                        troopsReceived:
                          type: integer
                        lastObservedActivityAt:
                          type: string
                          nullable: true
                        lastCheckedAt:
                          type: string
                          nullable: true
                        activityStatus:
                          type: string
                        interpretation:
                          type: string
                      additionalProperties: true
                additionalProperties: true
  /api/v1/clan/summary:
    get:
      operationId: getClanSummary
      summary: Get clan roster summary
      responses:
        '200':
          description: Clan summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/clan/members:
    get:
      operationId: getClanMembers
      summary: List clan members or search by player name
      description: For questions about the full clan roster, request limit=100. The response includes totalMembers for the actual live roster size and count for records returned. Use search to find a specific player without fetching the full roster.
      parameters:
        - in: query
          name: search
          required: false
          description: Optional player-name search.
          schema:
            type: string
        - in: query
          name: limit
          required: false
          description: Number of records to return. Use 100 to retrieve the full roster (maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Clan member records
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/war/current:
    get:
      operationId: getCurrentWar
      summary: Get latest synced war, participants, and attacks
      responses:
        '200':
          description: Current war data
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/war/history:
    get:
      operationId: getWarHistory
      summary: List recent synced wars
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: War history
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/capital-raids/latest:
    get:
      operationId: getLatestCapitalRaid
      summary: Get latest Capital Raid Weekend and participants
      responses:
        '200':
          description: Latest raid data
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/sync/status:
    get:
      operationId: getSyncStatus
      summary: Get recent sync outcomes
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/sync/refresh:
    post:
      operationId: refreshClashOfClansData
      summary: Refresh supported Clash of Clans datasets
      description: Call only when the user explicitly asks to refresh the data.
      responses:
        '200':
          description: Refresh results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
        '409':
          description: A sync is already running
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                additionalProperties: true
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

