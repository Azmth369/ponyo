openapi: 3.1.0
info:
  title: Ponyo Clash of Clans API
  version: 1.0.5
  description: Read clan roster, activity estimates, war history, Capital Raid data, player contribution, and sync status. Refresh only when explicitly requested.
servers:
  - url: https://ponyo-v845.onrender.com
paths:
  /api/v1/clan/player-capital-contribution:
    get:
      operationId: getPlayerCapitalContribution
      summary: Get a player's lifetime Clan Capital contribution
      description: Use the exact player tag when available. This is lifetime clanCapitalContributions, not loot gained in one raid weekend. Name lookups can return ambiguous matches.
      parameters:
        - name: player
          in: query
          required: true
          description: Player tag or player name
          schema:
            type: string
      responses:
        '200':
          description: Player contribution or ambiguous matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - type: object
                        properties:
                          name: { type: string }
                          playerTag: { type: string }
                          clanName: { type: [string, 'null'] }
                          townHallLevel: { type: [integer, 'null'] }
                          totalClanCapitalContribution: { type: integer }
                        additionalProperties: true
                      - type: 'null'
                  metric: { type: string }
                  source: { type: string }
                  checkedAt: { type: string }
                  note: { type: string }
                  ambiguous: { type: boolean }
                  message: { type: string }
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        playerTag: { type: string }
                        townHallLevel: { type: integer }
                      additionalProperties: true
                  error: { type: string }
                additionalProperties: true
        '400':
          description: Missing player parameter
        '404':
          description: No matching player; a player tag can be supplied
  /api/v1/clan/activity:
    get:
      operationId: getClanPlayerActivity
      summary: Get player activity changes and donation leaders
      description: Compares current live roster values with stored snapshots at or before the requested window start. Can identify observed Town Hall upgrades and donation/received-counter increases when a suitable baseline snapshot exists. Not an exact login tracker. Lifetime Clan Capital contribution deltas require separate historical contribution snapshots and are not included yet.
      parameters:
        - name: hours
          in: query
          required: false
          description: Lookback window in hours, from 1 to 168; default 24
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
      responses:
        '200':
          description: Snapshot-based player activity report
          content:
            application/json:
              schema:
                type: object
                properties:
                  clanName: { type: string }
                  clanTag: { type: string }
                  windowHours: { type: integer }
                  windowStart: { type: string }
                  windowEnd: { type: string }
                  count: { type: integer }
                  source: { type: string }
                  generatedAt: { type: string }
                  snapshotCoverage:
                    type: object
                    properties:
                      membersWithBaseline: { type: integer }
                      currentMembers: { type: integer }
                      latestSnapshotAt: { type: [string, 'null'] }
                      latestSnapshotAgeHours: { type: [number, 'null'] }
                    additionalProperties: true
                  townHallUpgrades:
                    type: array
                    items:
                      type: object
                      properties:
                        playerTag: { type: string }
                        name: { type: string }
                        previousTownHallLevel: { type: [integer, 'null'] }
                        townHallLevel: { type: [integer, 'null'] }
                        townHallUpgradeObserved: { type: boolean }
                        baselineSnapshotAt: { type: [string, 'null'] }
                      additionalProperties: true
                  donationLeaders:
                    type: array
                    items:
                      type: object
                      properties:
                        playerTag: { type: string }
                        name: { type: string }
                        previousDonations: { type: [integer, 'null'] }
                        currentDonations: { type: integer }
                        donationsInWindow: { type: [integer, 'null'] }
                        donationCounterReset: { type: boolean }
                        baselineSnapshotAt: { type: [string, 'null'] }
                      additionalProperties: true
                  receivedLeaders:
                    type: array
                    items:
                      type: object
                      properties:
                        playerTag: { type: string }
                        name: { type: string }
                        receivedInWindow: { type: [integer, 'null'] }
                      additionalProperties: true
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  note: { type: string }
                additionalProperties: true
  /api/v1/clan/summary:
    get:
      operationId: getClanSummary
      summary: Get live clan roster summary
      responses:
        '200':
          description: Summary calculated from the live roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  data:
                    type: object
                    properties:
                      clanName: { type: string }
                      clanTag: { type: string }
                      members: { type: integer }
                      totalDonations: { type: integer }
                      totalReceived: { type: integer }
                      averageTrophies: { type: integer }
                      townHallCounts:
                        type: object
                        additionalProperties: { type: integer }
                      roles:
                        type: object
                        additionalProperties: { type: integer }
                      generatedAt: { type: string }
                    additionalProperties: true
                  error: { type: string }
                additionalProperties: true
  /api/v1/clan/members:
    get:
      operationId: getClanMembers
      summary: List or search live clan members
      description: For the full roster use limit=100. totalMembers is the live roster size; count is the number returned.
      parameters:
        - name: search
          in: query
          required: false
          description: Optional partial player-name search
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum records to return, up to 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Live roster records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        player_id: { type: string }
                        name: { type: string }
                        role: { type: [string, 'null'] }
                        th: { type: [integer, 'null'] }
                        lvl: { type: [integer, 'null'] }
                        trophies: { type: [integer, 'null'] }
                        troops_donated: { type: [integer, 'null'] }
                        troops_received: { type: [integer, 'null'] }
                      additionalProperties: true
                  count: { type: integer }
                  totalMembers: { type: integer }
                  filteredMembers: { type: integer }
                  limit: { type: integer }
                  source: { type: string }
                  clanName: { type: string }
                  refreshedAt: { type: string }
                additionalProperties: true
  /api/v1/war/current:
    get:
      operationId: getCurrentWar
      summary: Get current live war status and details
      responses:
        '200':
          description: Live current-war result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      state: { type: string }
                      teamSize: { type: integer }
                      preparationStartTime: { type: string }
                      startTime: { type: string }
                      endTime: { type: string }
                      clan: { type: object, additionalProperties: true }
                      opponent: { type: object, additionalProperties: true }
                    additionalProperties: true
                  source: { type: string }
                  checkedAt: { type: string }
                  isLive: { type: boolean }
                  error: { type: string }
                additionalProperties: true
  /api/v1/war/history:
    get:
      operationId: getWarHistory
      summary: List recent stored regular Clan Wars (not CWL rounds)
      description: This endpoint reads cw_session and returns regular Clan War history only. Use CWL history separately; invalid stored destruction percentages are returned as null.
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of recent wars to return, maximum 50
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Recent stored war summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        cw_uid: { type: string }
                        opponent_clan_name: { type: [string, 'null'] }
                        opponent_clan_id: { type: [string, 'null'] }
                        size: { type: [integer, 'null'] }
                        battle_start: { type: [string, 'null'] }
                        battle_end: { type: [string, 'null'] }
                        result: { type: [string, 'null'] }
                        our_clan_score: { type: [integer, 'null'] }
                        opponent_clan_score: { type: [integer, 'null'] }
                        our_clan_destruction: { type: [number, 'null'] }
                        opponent_clan_destruction: { type: [number, 'null'] }
                      additionalProperties: true
                  count: { type: integer }
                  source: { type: string }
                  warType: { type: string, description: Always regular_clan_war for this endpoint }
                  note: { type: string }
                additionalProperties: true
  /api/v1/cwl/history:
    get:
      operationId: getCwlHistory
      summary: Get stored Clan War League season and round history
      description: This endpoint returns CWL seasons and their league rounds, separately from regular Clan War history. Use this for CWL questions.
      parameters:
        - name: seasons
          in: query
          required: false
          description: Number of recent stored CWL seasons, maximum 12
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 3
        - name: rounds
          in: query
          required: false
          description: Maximum rounds returned per season, maximum 7
          schema:
            type: integer
            minimum: 1
            maximum: 7
            default: 7
      responses:
        '200':
          description: CWL seasons and rounds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        seasonId: { type: string }
                        season: { type: [string, 'null'] }
                        battleStart: { type: [string, 'null'] }
                        battleEnd: { type: [string, 'null'] }
                        starsScored: { type: [integer, 'null'] }
                        clanParticipants: { type: [integer, 'null'] }
                        rounds:
                          type: array
                          items:
                            type: object
                            properties:
                              generated_cwl_day_id: { type: string }
                              battle_day: { type: integer }
                              battle_start: { type: [string, 'null'] }
                              battle_end: { type: [string, 'null'] }
                              size: { type: [integer, 'null'] }
                              opponent_clan_name: { type: [string, 'null'] }
                              opponent_clan_id: { type: [string, 'null'] }
                              our_clan_score: { type: [integer, 'null'] }
                              opponent_clan_score: { type: [integer, 'null'] }
                              warType: { type: string }
                              result: { type: string }
                              participants:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    player_name: { type: string }
                                    player_id: { type: [string, 'null'] }
                                    attacks_used: { type: [integer, 'null'] }
                                    attacks_available: { type: [integer, 'null'] }
                                    stars_scored: { type: [integer, 'null'] }
                                    destruction_caused: { type: [number, 'null'] }
                                    player_map_position: { type: [integer, 'null'] }
                                  additionalProperties: true
                            additionalProperties: true
                      additionalProperties: true
                  count: { type: integer }
                  source: { type: string }
                  warType: { type: string }
                  note: { type: string }
                additionalProperties: true
  /api/v1/capital-raids/history:
    get:
      operationId: getCapitalRaidHistory
      summary: Get historical Capital Raid Weekends
      description: Returns compact stored Capital Raid Weekend summaries and participant leaderboards. Use includeAttacks=true only when attack-level detail is specifically needed, because it increases response size.
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of recent raid weekends, maximum 50
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: includeAttacks
          in: query
          required: false
          description: Include attack-level records. Leave false for normal history queries to keep the response compact.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Historical raid weekends
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        generated_uid: { type: string }
                        battle_start: { type: [string, 'null'] }
                        battle_end: { type: [string, 'null'] }
                        total_loot: { type: [integer, 'null'] }
                        raids_won: { type: [integer, 'null'] }
                        total_attacks: { type: [integer, 'null'] }
                        participants_no: { type: [integer, 'null'] }
                        absentees_no: { type: [integer, 'null'] }
                        participants:
                          type: array
                          items:
                            type: object
                            properties:
                              player_name: { type: [string, 'null'] }
                              player_id: { type: [string, 'null'] }
                              attacks_used: { type: [integer, 'null'] }
                              attacks_available: { type: [integer, 'null'] }
                              total_loot_gained: { type: [integer, 'null'] }
                            additionalProperties: true
                        attacks:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                        attackDetailsAvailable: { type: [boolean, 'null'] }
                        warType: { type: string }
                      additionalProperties: true
                  count: { type: integer }
                  limit: { type: integer }
                  includeAttacks: { type: boolean }
                  source: { type: string }
                  historyType: { type: string }
                  note: { type: string }
                additionalProperties: true
  /api/v1/capital-raids/latest:
    get:
      operationId: getLatestCapitalRaid
      summary: Get latest stored Capital Raid Weekend and participants
      responses:
        '200':
          description: Latest stored raid season and participant records, or no stored season
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - type: object
                        properties:
                          season: { type: object, additionalProperties: true }
                          participants:
                            type: array
                            items:
                              type: object
                              properties:
                                player_name: { type: string }
                                player_id: { type: [string, 'null'] }
                                attacks_used: { type: [integer, 'null'] }
                                attacks_available: { type: [integer, 'null'] }
                                total_loot_gained: { type: [integer, 'null'] }
                              additionalProperties: true
                        additionalProperties: true
                      - type: 'null'
                  source: { type: string }
                additionalProperties: true
  /api/v1/sync/status:
    get:
      operationId: getSyncStatus
      summary: Get recent sync outcomes
      responses:
        '200':
          description: Up to 30 most recent sync run records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        job: { type: string }
                        status: { type: string }
                        details: {}
                        message: { type: [string, 'null'] }
                        started_at: { type: [string, 'null'] }
                        finished_at: { type: [string, 'null'] }
                      additionalProperties: true
                additionalProperties: true
  /api/v1/sync/refresh:
    post:
      operationId: refreshClashOfClansData
      summary: Refresh supported Clash of Clans datasets
      description: Call only when the user explicitly asks to refresh data. A refresh may return 409 when another sync is running.
      responses:
        '200':
          description: Manual refresh results
          content:
            application/json:
              schema:
                type: object
                properties:
                  busy: { type: boolean }
                  completedAt: { type: string }
                  results:
                    type: object
                    additionalProperties: {}
                  message: { type: string }
                additionalProperties: true
        '409':
          description: A sync is already running
          content:
            application/json:
              schema:
                type: object
                properties:
                  busy: { type: boolean }
                  message: { type: string }
                additionalProperties: true
