openapi: 3.1.0
info:
  title: Ponyo Clash of Clans API
  version: 1.0.2
  description: Access synced Clash of Clans data from Ponyo. Manual refresh runs only when explicitly requested.
servers:
  - url: https://ponyo-v845.onrender.com
security:
  - BearerAuth: []
paths:
  /api/v1/clan/summary:
    get:
      operationId: getClanSummary
      summary: Get clan roster summary
      responses:
        '200':
          description: Clan summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/clan/members:
    get:
      operationId: getClanMembers
      summary: List clan members or search by player name
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Clan member records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/war/current:
    get:
      operationId: getCurrentWar
      summary: Get latest synced war, participants, and attacks
      responses:
        '200':
          description: Current war data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/war/history:
    get:
      operationId: getWarHistory
      summary: List recent synced wars
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Recent war history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/capital-raids/latest:
    get:
      operationId: getLatestCapitalRaid
      summary: Get latest synced Capital Raid Weekend and participants
      responses:
        '200':
          description: Latest raid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/sync/status:
    get:
      operationId: getSyncStatus
      summary: Get recent scheduled and manual sync outcomes
      responses:
        '200':
          description: Sync status records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/sync/refresh:
    post:
      operationId: refreshClashOfClansData
      summary: Refresh supported Clash of Clans datasets
      description: Call only when the user explicitly asks to refresh data.
      responses:
        '200':
          description: Refresh results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          description: A sync is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the request succeeded
        data:
          description: Returned API data
        error:
          type: string
          description: Error message, if any
      additionalProperties: true
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
