openapi: 3.0.3
info:
  title: Ponyo Clash of Clans API
  version: 1.0.3
  description: Access synced Clash of Clans data from Ponyo. Refresh only when explicitly requested.
servers:
  - url: https://ponyo-v845.onrender.com
security:
  - BearerAuth: []
paths:
  /api/v1/clan/player-capital-contribution:
    get:
      operationId: getPlayerCapitalContribution
      summary: Get a player's lifetime Clan Capital contribution
      description: Use this endpoint when asked for a player's total Capital contribution or contribution reputation. This is the lifetime clanCapitalContributions statistic from the player's live profile, not total loot gained in a single Capital Raid Weekend.
      parameters:
        - in: query
          name: player
          required: true
          description: Exact player name or player tag. If multiple players match, the response lists candidates to disambiguate.
          schema:
            type: string
      responses:
        '200':
          description: Player lifetime contribution or ambiguous matches
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Missing player parameter
        '404':
          description: No current clan member matched
  /api/v1/clan/summary:
    get:
      operationId: getClanSummary
      summary: Get clan roster summary
      responses:
        '200':
          description: Clan summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/clan/members:
    get:
      operationId: getClanMembers
      summary: List clan members or search by player name
      description: For questions about the full clan roster, request limit=100. The response includes totalMembers for the actual live roster size and count for records returned. Use search to find a specific player without fetching the full roster.
      parameters:
        - in: query
          name: search
          required: false
          description: Optional player-name search.
          schema:
            type: string
        - in: query
          name: limit
          required: false
          description: Number of records to return. Use 100 to retrieve the full roster (maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Clan member records
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/war/current:
    get:
      operationId: getCurrentWar
      summary: Get latest synced war, participants, and attacks
      responses:
        '200':
          description: Current war data
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/war/history:
    get:
      operationId: getWarHistory
      summary: List recent synced wars
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: War history
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/capital-raids/latest:
    get:
      operationId: getLatestCapitalRaid
      summary: Get latest Capital Raid Weekend and participants
      responses:
        '200':
          description: Latest raid data
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/sync/status:
    get:
      operationId: getSyncStatus
      summary: Get recent sync outcomes
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
  /api/v1/sync/refresh:
    post:
      operationId: refreshClashOfClansData
      summary: Refresh supported Clash of Clans datasets
      description: Call only when the user explicitly asks to refresh the data.
      responses:
        '200':
          description: Refresh results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  error:
                    type: string
                additionalProperties: true
        '409':
          description: A sync is already running
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                additionalProperties: true
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
